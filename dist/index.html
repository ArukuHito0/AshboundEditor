<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バランス調整 | ASHBOUND</title>
<link rel="stylesheet" href="balance-editor.css?v=21">
<main>
  <header>
    <a href="https://ashbound-deck-hunt.takeshita0205ayumu.chatgpt.site/">ASHBOUND / 灰燼の契約</a>
    <h1>バランス調整</h1>
    <p>カードのコストと効果、ACT1〜7の敵HP・行動と通常遭遇の重みを調整します。</p>
  </header>
  <p id="status" role="status">ゲームデータを読み込んでいます。</p>
  <section id="editor" hidden>
    <div id="groups" class="controls" aria-label="編集対象"></div>
    <div class="controls filters">
      <label><span id="search-label">名前</span> <input id="search" type="search" placeholder="カード名"></label>
      <label data-card-filter>カードの分類 <select id="potentialOwner"><option value="">すべて</option></select></label>
      <label data-card-filter>キーワード <select id="keywords"><option value="">すべて</option></select></label>
      <label data-card-filter>コスト <select id="cost"><option value="">すべて</option></select></label>
      <label data-card-filter>カードタイプ <select id="types"><option value="">すべて</option></select></label>
      <label data-card-filter>レアリティ <select id="rarity"><option value="">すべて</option></select></label>
      <label hidden>敵の種別 <select id="enemy-kind"><option value="">すべて</option><option value="normal">通常</option><option value="elite">強敵</option><option value="boss">ボス</option></select></label><label hidden>敵のACT <select id="enemy-act"><option value="">すべて</option><option value="1">ACT1</option><option value="2">ACT2</option><option value="3">ACT3</option><option value="4">ACT4</option><option value="5">ACT5</option><option value="6">ACT6</option><option value="7">ACT7</option></select></label>
      <label><input id="changes" type="checkbox"> 変更した項目のみ</label>
      <span id="count"></span>
    </div>
    <p id="no-results" hidden>条件に一致する項目がありません。</p>
    <div id="enemy-list" class="enemy-list" hidden></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th scope="col">対象</th><th scope="col">公開設定</th><th scope="col">調整値</th><th scope="col" id="difference">差分</th><th class="card-gutter" data-second-card aria-hidden="true" hidden></th><th scope="col" class="card-target" data-second-card hidden>対象</th><th scope="col" data-second-card hidden>公開設定</th><th scope="col" data-second-card hidden>調整値</th><th scope="col" data-second-card hidden>差分</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="controls actions">
      <button id="save" type="button">下書きを保存</button>
      <button id="publish" type="button" disabled>本編に反映</button>
      <label>反映履歴 <select id="balance-history" disabled><option value="">選択してください</option></select></label>
      <button id="load-release" type="button" disabled>履歴を調整値に読み込む</button>
      <button id="export" type="button">反映用ファイルを出力</button>
    </div>
    <dialog id="publish-dialog">
      <form method="dialog">
        <h2>本編に反映する変更</h2>
        <p>次に開始する探索から適用されます。</p>
        <ul id="publish-diff"></ul>
        <div class="controls">
          <button value="cancel">キャンセル</button>
          <button id="confirm-publish" type="button">反映を確定</button>
        </div>
      </form>
    </dialog>
    <section class="play">
      <h2>テストプレイ</h2>
      <div class="controls">
        <label>探索者 <select id="play-character"></select></label>
        <label>テストACT <select id="play-act"><option value="1">ACT1</option><option value="2">ACT2</option><option value="3">ACT3</option><option value="4">ACT4</option><option value="5">ACT5</option><option value="6">ACT6</option><option value="7" selected>ACT7</option></select></label>
        <label>戦闘 <select id="encounter"><option value="solo">通常・単体</option><option value="pairs">通常・複数</option><option value="elite">強敵</option><option value="boss">ボス</option></select></label>
        <button id="preview" disabled type="button">調整値で開始</button>
      </div>
      <details class="play-deck">
        <summary>テストデッキを編成 <span id="play-deck-count"></span></summary>
        <div class="controls">
          <label>カード名 <input id="play-card-search" type="search"></label>
          <label>カード <select id="play-card"></select></label>
          <button id="play-add-card" type="button">追加</button>
          <button id="play-reset-deck" type="button">初期デッキに戻す</button>
        </div>
        <p>基礎カードと選択中の探索者のカードを追加できます。基礎カードは合計10枚以上、同名カードは3枚までです。</p>
        <p id="play-deck-requirement" role="status"></p>
        <ul id="play-deck-list"></ul>
      </details>
      <p>テストプレイの進行は、このプレビュー内だけに保存されます。</p>
    </section>
  </section>
  <iframe id="game" title="ASHBOUND テストプレイ" sandbox="allow-scripts allow-same-origin allow-modals" hidden></iframe>
</main>
<script src="balance-settings.js"></script>
<script src="balance-editor.js?v=21"></script>
</html>
